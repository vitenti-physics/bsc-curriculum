project:
  type: website
  output-dir: _site

website:
  title: "PPC — Bacharelado em Física"
  description: "Documentos de trabalho do NDE para a reformulação curricular do Bacharelado em Física."
  site-url: https://vitenti-physics.github.io/bsc-curriculum/
  repo-url: https://github.com/vitenti-physics/bsc-curriculum
  repo-actions: [edit, issue]
  search: true
  page-footer:
    left: "Núcleo Docente Estruturante — Bacharelado em Física"
    right: "Construído com [Quarto](https://quarto.org)."
  navbar:
    pinned: true
    right:
      - text: "Início"
        href: index.qmd
      - icon: github
        href: https://github.com/vitenti-physics/bsc-curriculum
        aria-label: Repositório no GitHub
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - text: "Apresentação"
        href: index.qmd
      - section: "Organização Curricular"
        contents:
          - text: "Estrutura Curricular"
            href: chapters/curricular-structure.qmd
          - section: "Núcleo Comum (1º e 2º anos)"
            href: chapters/common-core.qmd
            contents:
              - text: "Primeiro ano — ementas"
                href: chapters/common-core-year1.qmd
              - text: "Segundo ano — ementas"
                href: chapters/common-core-year2.qmd
              - section: "Programas das disciplinas"
                href: chapters/course-programs/overview.qmd
                contents:
                  - text: "1º semestre"
                    href: chapters/course-programs/semester-1.qmd
                  - text: "2º semestre"
                    href: chapters/course-programs/semester-2.qmd
                  - text: "3º semestre"
                    href: chapters/course-programs/semester-3.qmd
                  - text: "4º semestre"
                    href: chapters/course-programs/semester-4.qmd
          - section: "Ciclo Avançado (3º e 4º anos)"
            href: chapters/advanced-cycle.qmd
            contents:
              - text: "Terceiro ano — ementas"
                href: chapters/advanced-cycle-year3.qmd
              - text: "Quarto ano — ementas"
                href: chapters/advanced-cycle-year4.qmd
          - text: "Grade Horária"
            href: chapters/timetable.qmd
      - text: "Referências"
        href: references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - style.scss
    toc: true
    toc-title: "Nesta página"
    toc-depth: 4
    toc-expand: true
    number-sections: true

lang: pt
